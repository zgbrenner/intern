name: Rust dependency lock

on:
  workflow_dispatch:
  pull_request:
    paths:
      - Cargo.toml
      - "**/Cargo.toml"
      - "**/*.rs"
      - .github/workflows/lockfile.yml
  push:
    branches:
      - codex/intern-v1
    paths:
      - Cargo.toml
      - "**/Cargo.toml"
      - "**/*.rs"
      - .github/workflows/lockfile.yml

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.88.0 --profile minimal --component rustfmt
          rustup default 1.88.0
      - name: Generate dependency lock
        run: cargo generate-lockfile
      - name: Format Rust sources
        run: |
          cargo fmt --all
          git diff --output=rustfmt.patch
      - name: Upload Cargo.lock and rustfmt patch
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: intern-cargo-lock
          if-no-files-found: error
          path: |
            Cargo.lock
            rustfmt.patch
