name: Publish Microsoft intake verification change
on:
  push:
    branches: [codex/intake-verification-workspace]
    paths: [.github/workflows/intake-workspace.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: '26645a82bda0741f573711db72218f3511556c68'
          persist-credentials: true
      - name: Apply prepared exact patch to isolated review branch
        shell: bash
        env:
          TRANSFER_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 26645a82bda0741f573711db72218f3511556c68
          git fetch --no-tags --depth=1 origin "$TRANSFER_COMMIT"
          python3 - <<'PY'
          import base64, hashlib, lzma, os, pathlib, subprocess
          revision = os.environ['TRANSFER_COMMIT']
          encoded = b''.join(subprocess.check_output(['git', 'show', f'{revision}:.intern-transfer/part{i}.b64']) for i in range(4))
          assert len(encoded) == 57640, 'Unexpected encoded size'
          patch = lzma.decompress(base64.b64decode(encoded, validate=True), memlimit=256 * 1024 * 1024)
          assert len(patch) == 189688, 'Unexpected patch size'
          assert hashlib.sha256(patch).hexdigest() == '21372a7ec1ef536eadb12198710e7faa1839b816581974ee156a5ae0543dc930', 'Patch integrity mismatch'
          pathlib.Path('/tmp/intern-microsoft.patch').write_bytes(patch)
          PY
          git apply --check /tmp/intern-microsoft.patch
          git apply --index /tmp/intern-microsoft.patch
          python3 - <<'PY'
          import subprocess
          paths = subprocess.check_output(['git', 'diff', '--cached', '--name-only', '-z']).decode().split('\0')
          paths = [p for p in paths if p]
          assert len(paths) == 39, f'Unexpected changed-file count: {len(paths)}'
          for path in paths:
              assert path in ('Cargo.lock', 'README.md') or path.startswith(('crates/', 'docs/', 'src/', 'src-tauri/')), path
              line = subprocess.check_output(['git', 'ls-files', '-s', '--', path]).decode()
              assert line.startswith('100644 '), f'Unexpected file mode for {path}: {line}'
          PY
          git diff --cached --check
          git config user.name 'OpenAI'
          git config user.email 'noreply@openai.com'
          git commit -m 'feat: fail-closed Microsoft upload identity pilot'
          git push origin HEAD:refs/heads/codex/microsoft-upload-identity
          git show --stat --oneline HEAD
