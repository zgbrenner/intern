name: Intake verification workspace
on:
  push:
    branches: [codex/intake-verification-workspace]
    paths: [.github/workflows/intake-workspace.yml]
permissions:
  contents: read
jobs:
  rust-workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install pinned verification toolchain
        run: rustup toolchain install 1.88.0 --profile minimal --component rustfmt,clippy
      - name: Fetch locked public crate sources
        run: cargo +1.88.0 fetch --locked
      - name: Package only public tools and crate cache
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/portable-rust"
          cp -a "$HOME/.rustup/toolchains/1.88.0-x86_64-unknown-linux-gnu" "$RUNNER_TEMP/portable-rust/toolchain"
          mkdir -p "$RUNNER_TEMP/portable-rust/cargo-home"
          cp -a "$HOME/.cargo/registry" "$RUNNER_TEMP/portable-rust/cargo-home/registry"
          tar -czf "$RUNNER_TEMP/intern-rust-workspace.tar.gz" -C "$RUNNER_TEMP/portable-rust" toolchain cargo-home
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: intern-rust-verification-workspace
          path: ${{ runner.temp }}/intern-rust-workspace.tar.gz
          retention-days: 1
