name: Whole-product QA evidence

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/qa.yml

permissions:
  contents: read

jobs:
  windows-whole-product-qa:
    name: Windows whole-product QA (no publish)
    runs-on: windows-latest
    timeout-minutes: 360
    env:
      CARGO_TERM_COLOR: always
      INTERN_QA_CAPTURE: "1"
      INTERN_REQUIRE_GENERATED_FIXTURES: "1"
      INTERN_PDFIUM_DIR: ${{ github.workspace }}\src-tauri\resources\native\pdfium
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Record immutable runner context
        shell: pwsh
        run: |
          New-Item -ItemType Directory docs\qa -Force | Out-Null
          [ordered]@{
            commit = (git rev-parse HEAD).Trim()
            runner_os = $env:RUNNER_OS
            runner_arch = $env:RUNNER_ARCH
            run_id = $env:GITHUB_RUN_ID
            run_attempt = $env:GITHUB_RUN_ATTEMPT
          } | ConvertTo-Json | Set-Content docs\qa\workflow-run.json -Encoding utf8NoBOM
      - name: Require committed Rust dependency lock
        shell: pwsh
        run: if (-not (Test-Path -LiteralPath Cargo.lock -PathType Leaf)) { throw "Cargo.lock must be committed; QA cannot resolve release dependencies implicitly" }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.15.0
          cache: npm
      - name: Install pinned Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install 1.88.0 --profile minimal --component rustfmt,clippy
          rustup default 1.88.0
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~\.cargo\registry
            ~\.cargo\git
            target
          key: qa-cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'src-tauri/resources/runtime-assets.json') }}
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}\intern-assets-cache
          key: qa-runtime-assets-${{ runner.os }}-${{ hashFiles('src-tauri/resources/runtime-assets.json', 'scripts/fetch-windows-assets.ps1') }}
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~\AppData\Local\ms-playwright
          key: qa-playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - run: npm run fixtures
      - name: Run frontend/unit/build checks with evidence log
        shell: pwsh
        run: |
          New-Item -ItemType Directory docs\qa\logs -Force | Out-Null
          & npm run check 2>&1 | Tee-Object -FilePath docs\qa\logs\npm-check.log
          if ($LASTEXITCODE -ne 0) { throw "npm run check failed" }
      - run: npx playwright install chromium
      - name: Run core path, accessibility, responsive, and screenshot QA
        shell: pwsh
        run: |
          & npm run test:e2e 2>&1 | Tee-Object -FilePath docs\qa\logs\playwright.log
          if ($LASTEXITCODE -ne 0) { throw "Playwright QA failed" }
      - name: Stage parser worker for desktop compile checks
        shell: pwsh
        run: |
          cargo build --locked -p intern-worker
          New-Item -ItemType Directory src-tauri\binaries -Force | Out-Null
          Copy-Item target\debug\intern-worker.exe src-tauri\binaries\intern-worker-x86_64-pc-windows-msvc.exe -Force
          New-Item -ItemType File src-tauri\binaries\llama-server-x86_64-pc-windows-msvc.exe -Force | Out-Null
          New-Item -ItemType File src-tauri\binaries\tesseract-x86_64-pc-windows-msvc.exe -Force | Out-Null
          New-Item -ItemType Directory src-tauri\resources\licenses -Force | Out-Null
          New-Item -ItemType Directory src-tauri\resources\tessdata -Force | Out-Null
          New-Item -ItemType Directory src-tauri\resources\native\pdfium -Force | Out-Null
          New-Item -ItemType Directory src-tauri\resources\native\sidecars -Force | Out-Null
          New-Item -ItemType File src-tauri\resources\licenses\compile-placeholder.txt -Force | Out-Null
          New-Item -ItemType File src-tauri\resources\tessdata\compile-placeholder.traineddata -Force | Out-Null
          New-Item -ItemType File src-tauri\resources\native\pdfium\compile-placeholder.dll -Force | Out-Null
          New-Item -ItemType File src-tauri\resources\native\sidecars\compile-placeholder.dll -Force | Out-Null
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Run Rust workspace tests with evidence log
        shell: pwsh
        # Cargo tests can leave descendant processes holding a PowerShell
        # pipeline pipe open after cargo itself exits. Redirect through cmd to a
        # real file handle so the step cannot hang after the suite completes.
        timeout-minutes: 45
        run: |
          New-Item -ItemType Directory docs\qa\logs -Force | Out-Null
          & cmd /c "cargo test --locked --workspace --all-targets > docs\qa\logs\cargo-test.log 2>&1"
          $TestExit = $LASTEXITCODE
          Get-Content -LiteralPath docs\qa\logs\cargo-test.log
          if ($TestExit -ne 0) { throw "Rust workspace tests failed" }
      - name: Build parser worker and the corpus evaluator
        shell: pwsh
        run: |
          cargo build --locked -p intern-worker --release --features windows-native
          cargo build --locked -p intern-engine --release --bin intern-evaluate
          New-Item -ItemType Directory src-tauri\binaries -Force | Out-Null
          Copy-Item target\release\intern-worker.exe src-tauri\binaries\intern-worker-x86_64-pc-windows-msvc.exe -Force
      - name: Fetch and verify pinned Windows assets
        shell: pwsh
        run: |
          Remove-Item src-tauri\resources\licenses\compile-placeholder.txt -Force
          Remove-Item src-tauri\resources\tessdata\compile-placeholder.traineddata -Force
          Remove-Item src-tauri\resources\native\pdfium\compile-placeholder.dll -Force
          Remove-Item src-tauri\resources\native\sidecars\compile-placeholder.dll -Force
          ./scripts/fetch-windows-assets.ps1 -CacheDirectory "${{ runner.temp }}\intern-assets-cache"
      - run: npm run assets:verify -- --require-bundled
      - name: Run generated-fixture parser integration with native assets
        shell: pwsh
        run: |
          & cargo test --locked -p intern-worker --test generated_fixtures --features windows-native 2>&1 | Tee-Object -FilePath docs\qa\logs\native-fixtures.log
          if ($LASTEXITCODE -ne 0) { throw "Native fixture integration failed" }
      - name: Stage and exercise the package-shaped runtime
        shell: pwsh
        run: |
          $Stage = Join-Path $env:RUNNER_TEMP "intern-qa-runtime-stage"
          ./scripts/stage-windows-runtime.ps1 -Destination $Stage
          ./scripts/smoke-worker.ps1 -WorkerPath (Join-Path $Stage "intern-worker.exe") -RuntimeDirectory $Stage
          "INTERN_QA_RUNTIME_STAGE=$Stage" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      # Same pinned toolset the CI and release builds use; see
      # scripts/prefetch-nsis.ps1 for why the bundler must not fetch its own.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}\intern-nsis-cache
          key: qa-nsis-toolset-${{ runner.os }}-${{ hashFiles('scripts/prefetch-nsis.ps1') }}
      - name: Stage the pinned NSIS toolset
        shell: pwsh
        run: ./scripts/prefetch-nsis.ps1 -CacheDirectory "${{ runner.temp }}\intern-nsis-cache"
      - run: npm run tauri build -- --bundles nsis -- --locked
      - name: Smoke test per-user installer and uninstall data retention
        shell: pwsh
        run: |
          $Installer = Get-ChildItem target\release\bundle\nsis\*.exe | Select-Object -First 1
          if (-not $Installer) { throw "NSIS installer was not produced" }
          # See the matching step in release.yml: this step runs no native command,
          # so $LASTEXITCODE is undefined and the old guard threw even when the
          # smoke test succeeded. The script's own `throw` fails the step.
          # *>&1, not 2>&1: these smoke scripts report through Write-Host, which
          # never enters the pipeline, so Tee-Object produced no log at all
          # while the output still showed in the step log. See release.yml.
          & ./scripts/smoke-installer.ps1 -InstallerPath $Installer.FullName -EvidencePath docs\qa\installed-core-smoke.json *>&1 | Tee-Object -FilePath docs\qa\logs\installer-smoke.log
          if (-not (Test-Path -LiteralPath 'docs\qa\logs\installer-smoke.log')) { throw "Installer smoke produced no log" }
      - name: Score the whole corpus through the shipping pipeline with real inference
        shell: pwsh
        run: |
          ./scripts/run-model-evaluation.ps1 `
            -RuntimeDirectory $env:INTERN_QA_RUNTIME_STAGE `
            -WorkerPath (Join-Path $env:INTERN_QA_RUNTIME_STAGE "intern-worker.exe") `
            -EvaluatePath target\release\intern-evaluate.exe `
            -OutputPath docs\qa\model-evaluation.json
          node scripts/validate-model-evaluation.mjs docs/qa/model-evaluation.json
      - name: Write run-specific command, count, and exit-code checklist
        if: success()
        shell: pwsh
        run: |
          $Npm = Get-Content docs\qa\logs\npm-check.log -Raw
          $Browser = Get-Content docs\qa\logs\playwright.log -Raw
          $Cargo = Get-Content docs\qa\logs\cargo-test.log -Raw
          $Native = Get-Content docs\qa\logs\native-fixtures.log -Raw
          $VitestFiles = [regex]::Match($Npm, 'Test Files\s+(\d+) passed').Groups[1].Value
          $VitestTests = [regex]::Match($Npm, 'Tests\s+(\d+) passed').Groups[1].Value
          $BrowserTests = [regex]::Match($Browser, '(\d+) passed').Groups[1].Value
          $RustTests = ([regex]::Matches($Cargo, 'test result: ok\. (\d+) passed') | ForEach-Object { [int]$_.Groups[1].Value } | Measure-Object -Sum).Sum
          $NativeTests = ([regex]::Matches($Native, 'test result: ok\. (\d+) passed') | ForEach-Object { [int]$_.Groups[1].Value } | Measure-Object -Sum).Sum
          $Evaluation = Get-Content docs\qa\model-evaluation.json -Raw | ConvertFrom-Json
          $Runtime = Get-Content src-tauri\resources\runtime-assets.json -Raw | ConvertFrom-Json
          $Commit = (git rev-parse HEAD).Trim()
          @"
          # Intern hosted QA run checklist

          **Automation status: PASS. Rendered agency sign-off remains required before release.**

          - Commit: ``$Commit``
          - Runner: ``$env:RUNNER_OS/$env:RUNNER_ARCH``
          - Run: ``$env:GITHUB_RUN_ID`` attempt ``$env:GITHUB_RUN_ATTEMPT``

          | Status | Command | Exit code | Exact count/result |
          |---|---|---:|---|
          | pass | ``npm run fixtures`` | 0 | $($Evaluation.records.Count) gold fixtures |
          | pass | ``npm run check`` | 0 | $VitestFiles Vitest files / $VitestTests tests; TypeScript and Vite build passed |
          | pass | ``npm run test:e2e`` | 0 | $BrowserTests Playwright tests; 1536x1024 capture written |
          | pass | ``cargo fmt --all -- --check`` | 0 | workspace formatting |
          | pass | ``cargo clippy --locked --workspace --all-targets -- -D warnings`` | 0 | workspace/all targets |
          | pass | ``cargo test --locked --workspace --all-targets`` | 0 | $RustTests Rust tests |
          | pass | ``npm run assets:verify -- --require-bundled`` | 0 | $($Runtime.bundled_files.Count) runtime files / $($Runtime.license_files.Count) license files |
          | pass | native ``generated_fixtures`` | 0 | $NativeTests native fixture tests |
          | pass | ``npm run tauri build -- --bundles nsis -- --locked`` | 0 | one NSIS installer |
          | pass | ``scripts/smoke-installer.ps1`` | 0 | install, packaged worker PDF/OCR, uninstall, user-data retention |
          | pass | ``scripts/run-model-evaluation.ps1`` | 0 | $($Evaluation.summary.evaluated) documents scored on $($Evaluation.model_file); peak model RSS $([math]::Round($Evaluation.peak_model_rss_bytes / 1MB)) MB |
          | pass | ``scripts/validate-model-evaluation.mjs`` | 0 | date/type/party/description accuracy and trap-date gates |

          This QA workflow has read-only repository permissions and does not tag, push, or publish.
          "@ | Set-Content docs\qa\release-checklist.md -Encoding utf8NoBOM
      - name: Bind QA artifacts to this immutable run
        if: success()
        shell: pwsh
        run: |
          $Installer = Get-ChildItem target\release\bundle\nsis\*.exe | Select-Object -First 1
          Copy-Item $Installer.FullName docs\qa\Intern-qa-installer.exe -Force
          node scripts/create-release-evidence.mjs `
            --root=. `
            --output=docs/qa/release-evidence-manifest.json `
            --commit=$env:GITHUB_SHA `
            --workflow="$env:GITHUB_WORKFLOW" `
            --run-id=$env:GITHUB_RUN_ID `
            --run-attempt=$env:GITHUB_RUN_ATTEMPT `
            --model-evaluation=docs/qa/model-evaluation.json `
            --screenshot=docs/qa/latest-implementation.png `
            --checklist=docs/qa/release-checklist.md `
            --fidelity-signoff=docs/qa/rendered-fidelity-signoff.json `
            --installed-core-smoke=docs/qa/installed-core-smoke.json `
            --installer=docs/qa/Intern-qa-installer.exe `
            --log=docs/qa/logs/npm-check.log `
            --log=docs/qa/logs/playwright.log `
            --log=docs/qa/logs/cargo-test.log `
            --log=docs/qa/logs/native-fixtures.log `
            --log=docs/qa/logs/installer-smoke.log
          node scripts/validate-release-evidence.mjs docs/qa/release-evidence-manifest.json `
            --allow-pending `
            --root=. `
            --commit=$env:GITHUB_SHA `
            --workflow="$env:GITHUB_WORKFLOW" `
            --run-id=$env:GITHUB_RUN_ID `
            --run-attempt=$env:GITHUB_RUN_ATTEMPT
      - name: Upload QA evidence without publishing a release
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: intern-whole-product-qa-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          path: |
            docs/qa/release-checklist.md
            docs/qa/fidelity-ledger.md
            docs/qa/model-evaluation.json
            docs/qa/latest-implementation.png
            docs/qa/rendered-fidelity-signoff.json
            docs/qa/installed-core-smoke.json
            docs/qa/release-evidence-manifest.json
            docs/qa/workflow-run.json
            docs/qa/logs/
            playwright-report/
            test-results/
            docs/qa/Intern-qa-installer.exe
