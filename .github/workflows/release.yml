name: Release v0.1.0-alpha.1

on:
  push:
    tags:
      - v0.1.0-alpha.1

permissions:
  contents: write

jobs:
  release:
    if: github.ref == 'refs/tags/v0.1.0-alpha.1'
    runs-on: windows-latest
    env:
      CARGO_TERM_COLOR: always
      INTERN_QA_CAPTURE: "1"
      INTERN_REQUIRE_GENERATED_FIXTURES: "1"
      INTERN_PDFIUM_DIR: ${{ github.workspace }}\src-tauri\resources\native\pdfium
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require exact annotated release tag and dependency lock
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_NAME -ne "v0.1.0-alpha.1") { throw "Refusing unexpected release ref $env:GITHUB_REF_NAME" }
          if ((git cat-file -t $env:GITHUB_REF_NAME).Trim() -ne "tag") { throw "Release ref must be an annotated tag object" }
          if ((git rev-parse "$($env:GITHUB_REF_NAME)^{commit}").Trim() -ne $env:GITHUB_SHA) { throw "Annotated tag does not resolve to the checked-out commit" }
          if (-not (Test-Path -LiteralPath Cargo.lock -PathType Leaf)) { throw "Cargo.lock must be committed; release dependency resolution is forbidden" }
          if (-not (Test-Path -LiteralPath docs\releases\v0.1.0-alpha.1.md -PathType Leaf)) { throw "Checked-in release notes are missing" }
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 9.0.x
      - name: Install pinned Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install 1.88.0 --profile minimal --component rustfmt,clippy
          rustup default 1.88.0
      - uses: actions/cache@v4
        with:
          path: |
            ~\.cargo\registry
            ~\.cargo\git
            target
          key: release-cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'src-tauri/resources/runtime-assets.json') }}
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\intern-assets-cache
          key: release-assets-${{ runner.os }}-${{ hashFiles('src-tauri/resources/runtime-assets.json', 'scripts/fetch-windows-assets.ps1') }}
      - run: npm ci
      - run: npm run fixtures
      - run: npm run check
      - run: npx playwright install chromium
      - run: npm run test:e2e
      - name: Stage parser worker for desktop compile checks
        shell: pwsh
        run: |
          cargo build --locked -p intern-worker
          New-Item -ItemType Directory src-tauri\binaries -Force | Out-Null
          Copy-Item target\debug\intern-worker.exe src-tauri\binaries\intern-worker-x86_64-pc-windows-msvc.exe -Force
          New-Item -ItemType File src-tauri\binaries\llama-server-x86_64-pc-windows-msvc.exe -Force | Out-Null
          New-Item -ItemType File src-tauri\binaries\tesseract-x86_64-pc-windows-msvc.exe -Force | Out-Null
          New-Item -ItemType Directory src-tauri\resources\licenses -Force | Out-Null
          New-Item -ItemType Directory src-tauri\resources\tessdata -Force | Out-Null
          New-Item -ItemType Directory src-tauri\resources\native\pdfium -Force | Out-Null
          New-Item -ItemType Directory src-tauri\resources\native\sidecars -Force | Out-Null
          New-Item -ItemType File src-tauri\resources\licenses\compile-placeholder.txt -Force | Out-Null
          New-Item -ItemType File src-tauri\resources\tessdata\compile-placeholder.traineddata -Force | Out-Null
          New-Item -ItemType File src-tauri\resources\native\pdfium\compile-placeholder.dll -Force | Out-Null
          New-Item -ItemType File src-tauri\resources\native\sidecars\compile-placeholder.dll -Force | Out-Null
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Run apply, undo, recovery, worker, and workspace tests
        shell: pwsh
        run: |
          New-Item -ItemType Directory release -Force | Out-Null
          & cargo test --locked --workspace --all-targets 2>&1 | Tee-Object -FilePath release\cargo-test.log
          if ($LASTEXITCODE -ne 0) { throw "Rust workspace tests failed" }
      - name: Build parser worker sidecar
        shell: pwsh
        run: |
          cargo build --locked -p intern-worker --release --features windows-native
          cargo build --locked -p intern-app --release --bin intern-model-evaluator
          cargo build --locked -p intern-app --release --bin intern-model-evidence-validator
          New-Item -ItemType Directory src-tauri\binaries -Force | Out-Null
          Copy-Item target\release\intern-worker.exe src-tauri\binaries\intern-worker-x86_64-pc-windows-msvc.exe -Force
      - name: Fetch and verify pinned Windows assets
        shell: pwsh
        run: |
          Remove-Item src-tauri\resources\licenses\compile-placeholder.txt -Force
          Remove-Item src-tauri\resources\tessdata\compile-placeholder.traineddata -Force
          Remove-Item src-tauri\resources\native\pdfium\compile-placeholder.dll -Force
          Remove-Item src-tauri\resources\native\sidecars\compile-placeholder.dll -Force
          ./scripts/fetch-windows-assets.ps1 -CacheDirectory "${{ runner.temp }}\intern-assets-cache"
      - run: npm run assets:verify -- --require-bundled
      - run: cargo test --locked -p intern-worker --test generated_fixtures --features windows-native
      - name: Stage and exercise real package-shaped runtime
        shell: pwsh
        run: |
          $Stage = Join-Path $env:RUNNER_TEMP "intern-runtime-stage"
          ./scripts/stage-windows-runtime.ps1 -Destination $Stage
          ./scripts/smoke-worker.ps1 -WorkerPath (Join-Path $Stage "intern-worker.exe") -RuntimeDirectory $Stage
          "INTERN_RUNTIME_STAGE=$Stage" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Rerun Q4 and Q8 production evaluation for this exact tag run
        shell: pwsh
        run: |
          New-Item -ItemType Directory release -Force | Out-Null
          & ./scripts/run-model-evaluation.ps1 `
            -RuntimeDirectory $env:INTERN_RUNTIME_STAGE `
            -WorkerPath (Join-Path $env:INTERN_RUNTIME_STAGE "intern-worker.exe") `
            -EvaluatorPath target\release\intern-model-evaluator.exe `
            -OutputPath release\model-evaluation.json 2>&1 | Tee-Object -FilePath release\model-evaluation.log
          if ($LASTEXITCODE -ne 0) { throw "Production model evaluation failed" }
      - name: Replay tag-run evidence through production extraction and validation
        shell: pwsh
        run: |
          target\release\intern-model-evidence-validator.exe `
            --worker (Join-Path $env:INTERN_RUNTIME_STAGE "intern-worker.exe") `
            --fixtures fixtures\generated `
            --report release\model-evaluation.json
          node scripts/validate-model-evaluation.mjs release\model-evaluation.json
      - run: npm run tauri build -- --bundles nsis -- --locked
      - name: Smoke test installer and installed worker
        shell: pwsh
        run: |
          $Installer = Get-ChildItem target\release\bundle\nsis\*.exe | Select-Object -First 1
          if (-not $Installer) { throw "NSIS installer was not produced" }
          & ./scripts/smoke-installer.ps1 -InstallerPath $Installer.FullName -EvidencePath release\installed-core-smoke.json 2>&1 | Tee-Object -FilePath release\installer-smoke.log
          if ($LASTEXITCODE -ne 0) { throw "Installed application smoke failed" }
      - name: Assemble release and generate validated SPDX documents
        shell: pwsh
        run: |
          $Release = New-Item -ItemType Directory -Path release -Force
          $Installer = Get-ChildItem target\release\bundle\nsis\*.exe | Select-Object -First 1
          Copy-Item $Installer.FullName (Join-Path $Release $Installer.Name)
          Copy-Item src-tauri\resources\THIRD_PARTY_NOTICES.md $Release
          Copy-Item src-tauri\resources\runtime-assets.json $Release
          Copy-Item docs\qa\latest-implementation.png $Release
          Copy-Item docs\qa\rendered-fidelity-signoff.json $Release
          ./scripts/generate-sbom.ps1 -ReleaseDirectory $Release.FullName -RuntimeStage $env:INTERN_RUNTIME_STAGE
          if (Get-ChildItem release -Recurse -File -Filter "*.gguf") { throw "Model files must not be release assets" }
          @"
          # Intern v0.1.0-alpha.1 release-run checklist

          - Commit: ``$env:GITHUB_SHA``
          - Workflow: ``$env:GITHUB_WORKFLOW``
          - Run: ``$env:GITHUB_RUN_ID`` attempt ``$env:GITHUB_RUN_ATTEMPT``
          - Durable apply, undo, recovery, worker, and workspace tests: pass
          - Production Q4/Q8 evaluation: pass and replayed through the production validator
          - Rendered screenshot: recaptured at 1536x1024 and bound to reviewed fidelity sign-off
          - Installed application: launch, clean shutdown, worker PDF/OCR path, uninstall, and data retention passed
          "@ | Set-Content release\release-checklist.md -Encoding utf8NoBOM
          node scripts/create-release-evidence.mjs `
            --root=. `
            --output=release/release-evidence-manifest.json `
            --commit=$env:GITHUB_SHA `
            --workflow="$env:GITHUB_WORKFLOW" `
            --run-id=$env:GITHUB_RUN_ID `
            --run-attempt=$env:GITHUB_RUN_ATTEMPT `
            --model-evaluation=release/model-evaluation.json `
            --screenshot=release/latest-implementation.png `
            --checklist=release/release-checklist.md `
            --fidelity-signoff=release/rendered-fidelity-signoff.json `
            --installed-core-smoke=release/installed-core-smoke.json `
            --installer="release/$($Installer.Name)" `
            --log=release/cargo-test.log `
            --log=release/model-evaluation.log `
            --log=release/installer-smoke.log
          node scripts/validate-release-evidence.mjs release/release-evidence-manifest.json `
            --root=. `
            --commit=$env:GITHUB_SHA `
            --workflow="$env:GITHUB_WORKFLOW" `
            --run-id=$env:GITHUB_RUN_ID `
            --run-attempt=$env:GITHUB_RUN_ATTEMPT
          Get-ChildItem release -File | Where-Object Name -ne "SHA256SUMS.txt" | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $_.Name
          } | Sort-Object | Set-Content release\SHA256SUMS.txt -Encoding ascii
      - name: Publish exact-tag GitHub release
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_NAME -ne "v0.1.0-alpha.1") { throw "Refusing to publish unexpected tag $env:GITHUB_REF_NAME" }
          if ((git cat-file -t $env:GITHUB_REF_NAME).Trim() -ne "tag") { throw "Release ref is not an annotated tag object" }
          $Assets = Get-ChildItem release -File | ForEach-Object FullName
          gh release create v0.1.0-alpha.1 $Assets --verify-tag --prerelease --notes-file docs/releases/v0.1.0-alpha.1.md --title "Intern v0.1.0-alpha.1"
