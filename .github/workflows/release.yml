name: Release v0.1.0-alpha.3

# Publishing is a deliberate act, not a side effect of merging. A maintainer
# dispatches this workflow against the exact main commit they want released;
# every guard below still refuses anything but that commit.
on:
  workflow_dispatch:

concurrency:
  group: intern-v0.1.0-alpha.3-release
  cancel-in-progress: false

permissions:
  contents: write
  # Keyless provenance for the installer. `id-token` lets the runner prove its own
  # identity to Sigstore, `attestations` lets it record the result against this
  # repository. No signing key or certificate is stored anywhere; there is nothing
  # to leak and nothing to rotate.
  id-token: write
  attestations: write

jobs:
  release_target:
    runs-on: ubuntu-latest
    outputs:
      eligible: ${{ steps.target.outputs.eligible }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - id: target
        shell: bash
        run: |
          set -euo pipefail
          tag='v0.1.0-alpha.3'
          test "$GITHUB_REF" = 'refs/heads/main' || test "$GITHUB_REF_NAME" = 'main'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          if git show-ref --verify --quiet "refs/tags/$tag"; then
            test "$(git cat-file -t "refs/tags/$tag")" = tag
            if test "$(git rev-parse "refs/tags/$tag^{commit}")" != "$GITHUB_SHA"; then
              echo 'eligible=false' >> "$GITHUB_OUTPUT"
              echo "$tag is already bound to an earlier main commit; this push is a no-op."
              exit 0
            fi
          fi
          echo 'eligible=true' >> "$GITHUB_OUTPUT"

  release:
    needs: release_target
    if: needs.release_target.outputs.eligible == 'true'
    runs-on: windows-latest
    env:
      RELEASE_TAG: v0.1.0-alpha.3
      CARGO_TERM_COLOR: always
      # Deliberately NOT capturing a fresh screenshot here; see the fidelity step
      # below. `qa.yml` still sets INTERN_QA_CAPTURE=1, which is where new captures
      # are produced for review.
      INTERN_REQUIRE_GENERATED_FIXTURES: "1"
      INTERN_PDFIUM_DIR: ${{ github.workspace }}\src-tauri\resources\native\pdfium
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Require exact main release commit and dependency lock
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_NAME -ne 'main') { throw "Refusing unexpected release ref $env:GITHUB_REF_NAME" }
          if ((git rev-parse HEAD).Trim() -ne $env:GITHUB_SHA) { throw 'Checkout does not match the dispatched main commit' }
          if (-not (Test-Path -LiteralPath Cargo.lock -PathType Leaf)) { throw "Cargo.lock must be committed; release dependency resolution is forbidden" }
          if (-not (Test-Path -LiteralPath docs\releases\v0.1.0-alpha.3.md -PathType Leaf)) { throw "Checked-in release notes are missing" }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.15.0
          cache: npm
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 9.0.x
      - name: Install pinned Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install 1.88.0 --profile minimal --component rustfmt,clippy
          rustup default 1.88.0
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~\.cargo\registry
            ~\.cargo\git
            target
          key: release-cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'src-tauri/resources/runtime-assets.json') }}
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}\intern-assets-cache
          key: release-assets-${{ runner.os }}-${{ hashFiles('src-tauri/resources/runtime-assets.json', 'scripts/fetch-windows-assets.ps1') }}
      - run: npm ci
      - run: npm run fixtures
      - run: npm run check
      - run: npx playwright install chromium
      - run: npm run test:e2e
      - name: Stage parser worker for desktop compile checks
        shell: pwsh
        run: |
          cargo build --locked -p intern-worker
          New-Item -ItemType Directory src-tauri\binaries -Force | Out-Null
          Copy-Item target\debug\intern-worker.exe src-tauri\binaries\intern-worker-x86_64-pc-windows-msvc.exe -Force
          New-Item -ItemType File src-tauri\binaries\llama-server-x86_64-pc-windows-msvc.exe -Force | Out-Null
          New-Item -ItemType File src-tauri\binaries\tesseract-x86_64-pc-windows-msvc.exe -Force | Out-Null
          New-Item -ItemType Directory src-tauri\resources\licenses -Force | Out-Null
          New-Item -ItemType Directory src-tauri\resources\tessdata -Force | Out-Null
          New-Item -ItemType Directory src-tauri\resources\native\pdfium -Force | Out-Null
          New-Item -ItemType Directory src-tauri\resources\native\sidecars -Force | Out-Null
          New-Item -ItemType File src-tauri\resources\licenses\compile-placeholder.txt -Force | Out-Null
          New-Item -ItemType File src-tauri\resources\tessdata\compile-placeholder.traineddata -Force | Out-Null
          New-Item -ItemType File src-tauri\resources\native\pdfium\compile-placeholder.dll -Force | Out-Null
          New-Item -ItemType File src-tauri\resources\native\sidecars\compile-placeholder.dll -Force | Out-Null
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Run apply, undo, recovery, worker, and workspace tests
        shell: pwsh
        # A hang here used to sit until the job's 360-minute limit. The suite
        # takes about ten minutes; this fails in a tenth of the time it took to
        # notice the last one.
        timeout-minutes: 45
        run: |
          New-Item -ItemType Directory release -Force | Out-Null
          # Redirected by cmd rather than piped through Tee-Object. This step
          # hung for over two hours while CI ran the identical `cargo test` on
          # the same commit and finished in 33 minutes; the only difference was
          # the PowerShell pipeline. A test process that outlives cargo inherits
          # the pipe's write handle, so Tee-Object waits for a writer that never
          # closes, and the step hangs after the tests have already passed.
          # cmd's > hands cargo a real file handle, so nothing can hold the
          # pipeline open, and the exit code is still cargo's own.
          & cmd /c "cargo test --locked --workspace --all-targets > release\cargo-test.log 2>&1"
          $TestExit = $LASTEXITCODE
          Get-Content -LiteralPath release\cargo-test.log
          if ($TestExit -ne 0) { throw "Rust workspace tests failed" }
      - name: Build parser worker sidecar
        shell: pwsh
        run: |
          cargo build --locked -p intern-worker --release --features windows-native
          cargo build --locked -p intern-engine --release --bin intern-evaluate
          New-Item -ItemType Directory src-tauri\binaries -Force | Out-Null
          Copy-Item target\release\intern-worker.exe src-tauri\binaries\intern-worker-x86_64-pc-windows-msvc.exe -Force
      - name: Fetch and verify pinned Windows assets
        shell: pwsh
        run: |
          Remove-Item src-tauri\resources\licenses\compile-placeholder.txt -Force
          Remove-Item src-tauri\resources\tessdata\compile-placeholder.traineddata -Force
          Remove-Item src-tauri\resources\native\pdfium\compile-placeholder.dll -Force
          Remove-Item src-tauri\resources\native\sidecars\compile-placeholder.dll -Force
          ./scripts/fetch-windows-assets.ps1 -CacheDirectory "${{ runner.temp }}\intern-assets-cache"
      - run: npm run assets:verify -- --require-bundled
      - run: cargo test --locked -p intern-worker --test generated_fixtures --features windows-native
      - name: Stage and exercise real package-shaped runtime
        shell: pwsh
        run: |
          $Stage = Join-Path $env:RUNNER_TEMP "intern-runtime-stage"
          ./scripts/stage-windows-runtime.ps1 -Destination $Stage
          ./scripts/smoke-worker.ps1 -WorkerPath (Join-Path $Stage "intern-worker.exe") -RuntimeDirectory $Stage
          "INTERN_RUNTIME_STAGE=$Stage" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Score the corpus through the shipping pipeline for this exact commit
        shell: pwsh
        # Downloads 1.19 GiB and scores 20 documents with real inference, about
        # 11 minutes when healthy. Bounded so a wedged llama-server cannot hold
        # the job open for hours.
        timeout-minutes: 60
        run: |
          New-Item -ItemType Directory release -Force | Out-Null
          # No $LASTEXITCODE guard: the script is PowerShell, so that variable
          # holds whatever its last *native* command left behind rather than the
          # script's own verdict. It happened to be the acceptance validator, so
          # the guard fired correctly once and reported "Corpus evaluation
          # failed" for a run whose evaluation had in fact completed and whose
          # model acceptance was blocked - the right outcome with the wrong
          # reason, and none of the gate's own explanation. The script now
          # prints the failures and throws deliberately.
          & ./scripts/run-model-evaluation.ps1 `
            -RuntimeDirectory $env:INTERN_RUNTIME_STAGE `
            -WorkerPath (Join-Path $env:INTERN_RUNTIME_STAGE "intern-worker.exe") `
            -EvaluatePath target\release\intern-evaluate.exe `
            -OutputPath release\model-evaluation.json 2>&1 | Tee-Object -FilePath release\model-evaluation.log
          node scripts/validate-model-evaluation.mjs release\model-evaluation.json
      # A refused release is the case where evidence matters most. Without this
      # the scored report died on the runner and the only surviving explanation
      # was a one-line exception.
      - name: Preserve the corpus evaluation even when it blocks the release
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: model-evaluation-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          path: |
            release/model-evaluation.json
            release/model-evaluation.log
      # Pin the bundler's own toolset rather than letting it fetch one mid-build.
      # See scripts/prefetch-nsis.ps1: an unpinned GitHub download here failed two
      # consecutive CI runs, and a release must not depend on it.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}\intern-nsis-cache
          key: release-nsis-toolset-${{ runner.os }}-${{ hashFiles('scripts/prefetch-nsis.ps1') }}
      - name: Stage the pinned NSIS toolset
        shell: pwsh
        run: ./scripts/prefetch-nsis.ps1 -CacheDirectory "${{ runner.temp }}\intern-nsis-cache"
      - name: Build the installer and sign the update artifact
        shell: pwsh
        env:
          # Signs the .nsis.zip update package. The matching public key is
          # committed in tauri.conf.json, and an installed Intern refuses any
          # update that does not verify against it. Without this secret the
          # build still produces an installer, so the guard below fails the
          # release rather than shipping updates nobody can install.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) {
            throw "TAURI_SIGNING_PRIVATE_KEY is not set; the in-app updater would ship an update no installed Intern can verify"
          }
          # createUpdaterArtifacts lives in a release-only config rather than
          # tauri.conf.json, because turning it on makes the bundler demand a
          # signing key from every build - which would break CI and the QA
          # workflow, neither of which should need release secrets, and would
          # break pull requests from forks outright.
          # Path is relative to the working directory, which is the repository
          # root, not src-tauri. Passing "tauri.release.conf.json" failed
          # argument validation 130ms into the step with "failed to read
          # configuration file".
          npm run tauri build -- --bundles nsis --config src-tauri/tauri.release.conf.json -- --locked
          if ($LASTEXITCODE -ne 0) { throw "Tauri build failed" }
      - name: Smoke test installer and installed worker
        shell: pwsh
        run: |
          $Installer = Get-ChildItem target\release\bundle\nsis\*.exe | Select-Object -First 1
          if (-not $Installer) { throw "NSIS installer was not produced" }
          # No $LASTEXITCODE check here: it is only set by a native command, and
          # this step runs none - the script drives the installer through
          # Start-Process and System.Diagnostics.Process. On a clean pwsh session
          # $LASTEXITCODE is undefined, so `$LASTEXITCODE -ne 0` evaluated true and
          # this guard threw on every run, including a completely successful smoke
          # test. The script's own `throw` is the real gate: under the pwsh shell's
          # $ErrorActionPreference = 'stop' it propagates through the pipeline and
          # fails the step.
          # *>&1, not 2>&1: smoke-installer.ps1 and smoke-worker.ps1 report
          # through Write-Host, which writes to the information stream and never
          # enters the pipeline. With 2>&1 the output still appeared in the step
          # log - so the step looked fine - but Tee-Object received nothing and
          # created no file at all, and the release died three steps later on
          # "ENOENT ... release\installer-smoke.log". Verified standalone: a
          # Write-Host-only script piped with 2>&1 produces no file, and with
          # *>&1 produces the file with its contents.
          & ./scripts/smoke-installer.ps1 -InstallerPath $Installer.FullName -EvidencePath release\installed-core-smoke.json *>&1 | Tee-Object -FilePath release\installer-smoke.log
          # Fail here, where the cause is visible, rather than in evidence
          # assembly where it reads as a missing artifact.
          if (-not (Test-Path -LiteralPath 'release\installer-smoke.log')) { throw "Installer smoke produced no log at release\installer-smoke.log" }
          if ((Get-Item -LiteralPath 'release\installer-smoke.log').Length -eq 0) { throw "Installer smoke log is empty; its output did not reach the pipeline" }
      - name: Assemble release and generate validated SPDX documents
        shell: pwsh
        run: |
          $Release = New-Item -ItemType Directory -Path release -Force
          $Installer = Get-ChildItem target\release\bundle\nsis\*.exe | Select-Object -First 1
          Copy-Item $Installer.FullName (Join-Path $Release $Installer.Name)
          Copy-Item src-tauri\resources\THIRD_PARTY_NOTICES.md $Release
          Copy-Item src-tauri\resources\runtime-assets.json $Release
          # Ship the capture a reviewer actually looked at, not a new one.
          #
          # This step used to regenerate the screenshot during the release run and
          # then require the sign-off to carry its SHA-256. That is unsatisfiable in
          # practice and weaker than it looks: the reviewer would have to predict
          # the digest of an image that does not exist yet, and the image they
          # inspected would not be the image that shipped. Any difference in font
          # rasterisation between runs blocked the release for no safety gain.
          #
          # The freshness guarantee comes from elsewhere and is unchanged: the
          # sign-off must carry `release_inputs_sha256`, which
          # scripts/hash-release-inputs.mjs computes over every tracked file
          # EXCEPT docs/qa/. Change any application code and the sign-off is
          # invalidated, forcing a fresh review. Change only the screenshot and its
          # own recorded digest must still match.
          if (-not (Test-Path docs\qa\latest-implementation.png)) {
            throw "docs/qa/latest-implementation.png is missing; capture it with the QA workflow and have it reviewed before releasing"
          }
          Copy-Item docs\qa\latest-implementation.png $Release
          Copy-Item docs\qa\rendered-fidelity-signoff.json $Release
          # The manifest an installed Intern reads to find a newer version.
          #
          # Tauri v2 signs the NSIS installer itself and writes the detached
          # signature beside it as <installer>.exe.sig - there is no separate
          # .nsis.zip package. This step originally looked for one and failed
          # with "Updater artifact was not produced" on a build that had in fact
          # signed correctly, reporting "Finished 1 updater signature at:
          # ...x64-setup.exe.sig". The installer already copied into release/
          # above is therefore both the manual download and the update payload,
          # so latest.json points at that one asset.
          #
          # The .sig file is not published: the updater reads the signature out
          # of latest.json and checks it against the public key compiled into
          # the installed build.
          $SignatureFile = "$($Installer.FullName).sig"
          if (-not (Test-Path -LiteralPath $SignatureFile)) {
            throw ("Installer is unsigned for updates: $SignatureFile is missing. " +
              "Check createUpdaterArtifacts in src-tauri/tauri.release.conf.json and TAURI_SIGNING_PRIVATE_KEY.")
          }
          $Signature = (Get-Content -LiteralPath $SignatureFile -Raw).Trim()
          if (-not $Signature) { throw "Update signature file is empty: $SignatureFile" }
          [ordered]@{
            version = $env:RELEASE_TAG.TrimStart("v")
            notes = "See https://github.com/$env:GITHUB_REPOSITORY/releases/tag/$env:RELEASE_TAG"
            pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = [ordered]@{
              "windows-x86_64" = [ordered]@{
                signature = $Signature
                url = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:RELEASE_TAG/$($Installer.Name)"
              }
            }
          } | ConvertTo-Json -Depth 6 | Set-Content (Join-Path $Release "latest.json") -Encoding utf8NoBOM
          # This is an offline cryptographic verification, not merely a check
          # that Tauri happened to emit nonempty text. The verifier decodes the
          # public Minisign key committed in tauri.conf.json, verifies the exact
          # installer bytes, and binds the detached signature to latest.json's
          # version, tag, repository URL, filename, and inline signature.
          cargo run --locked -p intern-release-verifier -- `
            --installer (Join-Path $Release $Installer.Name) `
            --signature $SignatureFile `
            --latest-json (Join-Path $Release "latest.json") `
            --tauri-config src-tauri/tauri.conf.json `
            --tag $env:RELEASE_TAG `
            --repository $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { throw "Updater installer/signature/latest.json verification failed" }
          ./scripts/generate-sbom.ps1 -ReleaseDirectory $Release.FullName -RuntimeStage $env:INTERN_RUNTIME_STAGE
          if (Get-ChildItem release -Recurse -File -Filter "*.gguf") { throw "Model files must not be release assets" }
          @"
          # Intern v0.1.0-alpha.3 release-run checklist

          - Commit: ``$env:GITHUB_SHA``
          - Workflow: ``$env:GITHUB_WORKFLOW``
          - Run: ``$env:GITHUB_RUN_ID`` attempt ``$env:GITHUB_RUN_ATTEMPT``
          - Durable apply, undo, recovery, worker, and workspace tests: pass
          - Corpus evaluation on the pinned local model through the shipping pipeline: pass
          - Rendered screenshot: the reviewed 1536x1024 capture, shipped as-is and bound to the fidelity sign-off by release_inputs_sha256
          - Installed application: launch, clean shutdown, worker PDF/OCR path, uninstall, and data retention passed
          "@ | Set-Content release\release-checklist.md -Encoding utf8NoBOM
          # The checksum list intentionally excludes itself and the evidence
          # manifest. Including either would create a digest cycle. The evidence
          # manifest created below hashes SHA256SUMS.txt and every other required
          # release artifact, so the published chain remains complete.
          $Sums = Get-ChildItem release -File | Where-Object Name -notin @("SHA256SUMS.txt", "release-evidence-manifest.json") | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $_.Name
          } | Sort-Object
          [IO.File]::WriteAllText((Join-Path (Get-Location) "release\SHA256SUMS.txt"), ($Sums -join "`n") + "`n", [Text.UTF8Encoding]::new($false))
          $Sboms = @(Get-ChildItem release -File -Filter "*.spdx.json" | Sort-Object Name)
          if ($Sboms.Count -eq 0) { throw "Release SBOM generation produced no SPDX documents" }
          $SbomArguments = @($Sboms | ForEach-Object { "--sbom=release/$($_.Name)" })
          node scripts/create-release-evidence.mjs `
            --root=. `
            --output=release/release-evidence-manifest.json `
            --commit=$env:GITHUB_SHA `
            --workflow="$env:GITHUB_WORKFLOW" `
            --run-id=$env:GITHUB_RUN_ID `
            --run-attempt=$env:GITHUB_RUN_ATTEMPT `
            --model-evaluation=release/model-evaluation.json `
            --screenshot=release/latest-implementation.png `
            --checklist=release/release-checklist.md `
            --fidelity-signoff=release/rendered-fidelity-signoff.json `
            --installed-core-smoke=release/installed-core-smoke.json `
            --installer="release/$($Installer.Name)" `
            --latest-json=release/latest.json `
            --runtime-assets=release/runtime-assets.json `
            --notices=release/THIRD_PARTY_NOTICES.md `
            --checksum=release/SHA256SUMS.txt `
            --log=release/cargo-test.log `
            --log=release/model-evaluation.log `
            --log=release/installer-smoke.log `
            @SbomArguments
          # $PSNativeCommandUseErrorActionPreference is False by default, so a
          # failing `node` does not throw even under $ErrorActionPreference =
          # 'stop'. Without these guards the step ran on after a failed assembly
          # and died at the next command with an ENOENT about the manifest,
          # naming neither the real fault nor the file that caused it.
          if ($LASTEXITCODE -ne 0) { throw "Could not assemble the release evidence manifest" }
          node scripts/validate-release-evidence.mjs release/release-evidence-manifest.json `
            --root=. `
            --commit=$env:GITHUB_SHA `
            --workflow="$env:GITHUB_WORKFLOW" `
            --run-id=$env:GITHUB_RUN_ID `
            --run-attempt=$env:GITHUB_RUN_ATTEMPT
          if ($LASTEXITCODE -ne 0) { throw "Release evidence was not accepted" }
      # Provenance for the one file a user downloads and runs, recorded only after
      # the evidence manifest above has already been accepted, so a rejected build
      # is never attested.
      #
      # This is not Authenticode. Windows and SmartScreen cannot read it, so an
      # unsigned installer still warns on first run. What it gives a downloader is
      # the ability to prove which repository, workflow, and commit produced the
      # exact bytes they hold:
      #
      #   gh attestation verify Intern_0.1.0-alpha.3_x64-setup.exe --repo zgbrenner/intern
      #
      # It needs no certificate and stores no key: the runner proves its own
      # identity through OIDC, so there is nothing to leak or rotate.
      - name: Attest installer provenance
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-path: release/*_x64-setup.exe
      - name: Create or verify exact annotated release tag
        shell: pwsh
        run: |
          $Tag = $env:RELEASE_TAG
          if ((git rev-parse HEAD).Trim() -ne $env:GITHUB_SHA) { throw 'Refusing to tag a commit other than this workflow commit' }
          git fetch --force --tags origin
          if ($LASTEXITCODE -ne 0) { throw 'Could not refresh remote tags' }
          git show-ref --verify --quiet "refs/tags/$Tag"
          $ShowRefExit = $LASTEXITCODE
          if ($ShowRefExit -eq 1) {
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git tag -a $Tag $env:GITHUB_SHA -m "Intern $Tag"
            if ($LASTEXITCODE -ne 0) { throw 'Could not create annotated release tag' }
            git push origin "refs/tags/$Tag"
            if ($LASTEXITCODE -ne 0) { throw 'Could not push annotated release tag' }
          } elseif ($ShowRefExit -ne 0) {
            throw 'Could not inspect release tag'
          }
          if ((git cat-file -t "refs/tags/$Tag").Trim() -ne 'tag') { throw 'Release ref must be an annotated tag object' }
          if ((git rev-parse "refs/tags/$Tag^{commit}").Trim() -ne $env:GITHUB_SHA) { throw 'Annotated tag does not resolve to this workflow commit' }
      - name: Publish exact-tag GitHub release
        shell: pwsh
        run: |
          $Tag = $env:RELEASE_TAG
          if ((git cat-file -t "refs/tags/$Tag").Trim() -ne 'tag') { throw 'Release ref is not an annotated tag object' }
          if ((git rev-parse "refs/tags/$Tag^{commit}").Trim() -ne $env:GITHUB_SHA) { throw 'Release tag does not resolve to this workflow commit' }
          $Assets = Get-ChildItem release -File | ForEach-Object FullName
          $Draft = gh release view $Tag --json isDraft --jq '.isDraft' 2>$null
          $ViewExit = $LASTEXITCODE
          if ($ViewExit -eq 0 -and $Draft.Trim() -eq 'false') {
            Write-Host "$Tag is already published; idempotent no-op."
            exit 0
          }
          if ($ViewExit -eq 0 -and $Draft.Trim() -eq 'true') {
            gh release upload $Tag $Assets --clobber
            if ($LASTEXITCODE -ne 0) { throw 'Could not repair draft release assets' }
            gh release edit $Tag --draft=false --latest --verify-tag --notes-file docs/releases/v0.1.0-alpha.3.md --title 'Intern v0.1.0-alpha.3'
            if ($LASTEXITCODE -ne 0) { throw 'Could not publish repaired draft release' }
            exit 0
          }
          if ($ViewExit -notin @(0, 1)) { throw 'Could not inspect existing release' }
          # --latest, not --prerelease. GitHub resolves /releases/latest to the
          # newest NON-prerelease release, and that path is what the in-app
          # updater fetches its manifest from - it is compiled into the build, so
          # a shipped app cannot be redirected elsewhere. Publishing as a
          # prerelease made every installed copy's update check return 404 while
          # the manifest sat one URL away, reachable only by exact tag. The
          # release is still plainly an alpha: the version says so and the
          # notes say so in their first line.
          gh release create $Tag $Assets --verify-tag --latest --notes-file docs/releases/v0.1.0-alpha.3.md --title 'Intern v0.1.0-alpha.3'
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish GitHub release' }
