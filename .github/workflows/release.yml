name: Release v0.1.0-alpha.1

on:
  push:
    tags:
      - v0.1.0-alpha.1

permissions:
  contents: write

jobs:
  release:
    if: github.ref == 'refs/tags/v0.1.0-alpha.1'
    runs-on: windows-latest
    env:
      CARGO_TERM_COLOR: always
      INTERN_REQUIRE_GENERATED_FIXTURES: "1"
      INTERN_PDFIUM_DIR: ${{ github.workspace }}\src-tauri\resources\native\pdfium
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require exact annotated release tag and dependency lock
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_NAME -ne "v0.1.0-alpha.1") { throw "Refusing unexpected release ref $env:GITHUB_REF_NAME" }
          if ((git cat-file -t $env:GITHUB_REF_NAME).Trim() -ne "tag") { throw "Release ref must be an annotated tag object" }
          if ((git rev-parse "$($env:GITHUB_REF_NAME)^{commit}").Trim() -ne $env:GITHUB_SHA) { throw "Annotated tag does not resolve to the checked-out commit" }
          if (-not (Test-Path -LiteralPath Cargo.lock -PathType Leaf)) { throw "Cargo.lock must be committed; release dependency resolution is forbidden" }
          if (-not (Test-Path -LiteralPath docs\releases\v0.1.0-alpha.1.md -PathType Leaf)) { throw "Checked-in release notes are missing" }
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 9.0.x
      - name: Require accepted Q4 evaluation evidence
        run: node scripts/validate-model-evaluation.mjs docs/qa/model-evaluation.json
      - name: Install pinned Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install 1.88.0 --profile minimal --component rustfmt,clippy
          rustup default 1.88.0
      - uses: actions/cache@v4
        with:
          path: |
            ~\.cargo\registry
            ~\.cargo\git
            target
          key: release-cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'src-tauri/resources/runtime-assets.json') }}
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\intern-assets-cache
          key: release-assets-${{ runner.os }}-${{ hashFiles('src-tauri/resources/runtime-assets.json', 'scripts/fetch-windows-assets.ps1') }}
      - run: npm ci
      - run: npm run fixtures
      - run: npm run check
      - run: npx playwright install chromium
      - run: npm run test:e2e
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace --all-targets
      - name: Build parser worker sidecar
        shell: pwsh
        run: |
          cargo build --locked -p intern-worker --release --features windows-native
          New-Item -ItemType Directory src-tauri\binaries -Force | Out-Null
          Copy-Item target\release\intern-worker.exe src-tauri\binaries\intern-worker-x86_64-pc-windows-msvc.exe -Force
      - name: Fetch and verify pinned Windows assets
        shell: pwsh
        run: ./scripts/fetch-windows-assets.ps1 -CacheDirectory "${{ runner.temp }}\intern-assets-cache"
      - run: npm run assets:verify -- --require-bundled
      - run: cargo test --locked -p intern-worker --test generated_fixtures --features windows-native
      - name: Stage and exercise real package-shaped runtime
        shell: pwsh
        run: |
          $Stage = Join-Path $env:RUNNER_TEMP "intern-runtime-stage"
          ./scripts/stage-windows-runtime.ps1 -Destination $Stage
          ./scripts/smoke-worker.ps1 -WorkerPath (Join-Path $Stage "intern-worker.exe") -RuntimeDirectory $Stage
          "INTERN_RUNTIME_STAGE=$Stage" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Run accepted production Q4 runtime smoke
        shell: pwsh
        run: ./scripts/smoke-q4-runtime.ps1 -LlamaServerPath (Join-Path $env:INTERN_RUNTIME_STAGE "llama-server.exe")
      - run: npm run tauri build -- --bundles nsis -- --locked
      - name: Smoke test installer and installed worker
        shell: pwsh
        run: |
          $Installer = Get-ChildItem target\release\bundle\nsis\*.exe | Select-Object -First 1
          if (-not $Installer) { throw "NSIS installer was not produced" }
          ./scripts/smoke-installer.ps1 -InstallerPath $Installer.FullName
      - name: Assemble release and generate validated SPDX documents
        shell: pwsh
        run: |
          $Release = New-Item -ItemType Directory -Path release -Force
          $Installer = Get-ChildItem target\release\bundle\nsis\*.exe | Select-Object -First 1
          Copy-Item $Installer.FullName (Join-Path $Release $Installer.Name)
          Copy-Item src-tauri\resources\THIRD_PARTY_NOTICES.md $Release
          Copy-Item src-tauri\resources\runtime-assets.json $Release
          ./scripts/generate-sbom.ps1 -ReleaseDirectory $Release.FullName -RuntimeStage $env:INTERN_RUNTIME_STAGE
          if (Get-ChildItem release -Recurse -File -Filter "*.gguf") { throw "Model files must not be release assets" }
          Get-ChildItem release -File | Where-Object Name -ne "SHA256SUMS.txt" | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $_.Name
          } | Sort-Object | Set-Content release\SHA256SUMS.txt -Encoding ascii
      - name: Publish exact-tag GitHub release
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_NAME -ne "v0.1.0-alpha.1") { throw "Refusing to publish unexpected tag $env:GITHUB_REF_NAME" }
          if ((git cat-file -t $env:GITHUB_REF_NAME).Trim() -ne "tag") { throw "Release ref is not an annotated tag object" }
          $Assets = Get-ChildItem release -File | ForEach-Object FullName
          gh release create v0.1.0-alpha.1 $Assets --verify-tag --prerelease --notes-file docs/releases/v0.1.0-alpha.1.md --title "Intern v0.1.0-alpha.1"
