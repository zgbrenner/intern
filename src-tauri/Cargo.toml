[package]
name = "intern-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
build = "build.rs"

[lib]
name = "intern_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "intern"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
intern-core = { path = "../crates/intern-core" }
intern-engine = { path = "../crates/intern-engine" }
intern-intake = { path = "../crates/intern-intake" }
intern-queue = { path = "../crates/intern-queue" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
tauri = { version = "2.11.2", features = [] }
tauri-plugin-dialog = "2.4.0"
# Pinned exactly, and kept in lockstep with @tauri-apps/plugin-updater in
# package.json. Tauri refuses to build when a plugin's Rust crate and npm
# package differ in major/minor, and a caret range let the crate float to 2.10.1
# against an npm 2.9.0 that had been pinned exactly - which failed the release
# with "Found version mismatched Tauri packages". Change both or neither.
tauri-plugin-updater = "=2.10.1"

[dev-dependencies]
tempfile = "=3.23.0"
