[package]
name = "intern-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
build = "build.rs"

[lib]
name = "intern_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "intern"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
chrono = { version = "=0.4.45", default-features = false, features = ["clock", "std"] }
intern-core = { path = "../crates/intern-core" }
intern-engine = { path = "../crates/intern-engine" }
intern-intake = { path = "../crates/intern-intake" }
intern-queue = { path = "../crates/intern-queue" }
# The hosted model's API key lives in the operating system's credential store
# (Windows Credential Manager, the macOS Keychain, the kernel keyring on
# Linux), never in settings.json. Native backends only: no D-Bus, no daemon.
keyring = { version = "=3.6.3", default-features = false, features = ["windows-native", "apple-native", "linux-native"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
tauri = { version = "2.11.2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2.5.1"
tauri-plugin-dialog = "2.4.0"
# The Help & support link hands one URL to the system browser. Scoped in
# capabilities/default.json to the published guide alone, so the webview
# cannot ask the shell to open anything else.
tauri-plugin-opener = "=2.5.5"
# Pinned exactly, and kept in lockstep with @tauri-apps/plugin-updater in
# package.json. Tauri refuses to build when a plugin's Rust crate and npm
# package differ in major/minor, and a caret range let the crate float to 2.10.1
# against an npm 2.9.0 that had been pinned exactly - which failed the release
# with "Found version mismatched Tauri packages". Change both or neither.
tauri-plugin-updater = "=2.10.1"
