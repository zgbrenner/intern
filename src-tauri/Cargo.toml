[package]
name = "intern-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
build = "build.rs"

[lib]
name = "intern_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "intern"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
intern-core = { path = "../crates/intern-core" }
intern-engine = { path = "../crates/intern-engine" }
intern-queue = { path = "../crates/intern-queue" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
tauri = { version = "2.11.2", features = [] }
tauri-plugin-dialog = "2.4.0"

[dev-dependencies]
tempfile = "=3.23.0"
