[package]
name = "intern-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "intern-analyze"
path = "src/bin/intern-analyze.rs"

[[bin]]
name = "intern-evaluate"
path = "src/bin/intern-evaluate.rs"

[dependencies]
base64 = "=0.22.1"
fs4 = "=0.13.1"
rand = "=0.8.5"
reqwest = { version = "=0.12.15", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
tokio = { version = "=1.45.1", features = ["macros", "rt", "time"] }
unicode-casefold = "=0.2.0"
unicode-normalization = "=0.1.24"

[dev-dependencies]
tempfile = "=3.23.0"
